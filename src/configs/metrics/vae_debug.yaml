device: "auto"
train:
  - _target_: src.metrics.BlockTypeAccuracy
    name: "BlockTypeAccuracy"
  - _target_: src.metrics.AP
    name: "AirAP"
  - _target_: src.metrics.AttributeAccuracy
    name: "MatchedAttrAccuracy"
  - _target_: src.metrics.AttributeAccuracy
    name: "GlobalAttrAccuracy"
    block_equality: False
  - _target_: src.metrics.MaxMemoryAllocated
    name: MaxMemoryAllocated
  - _target_: src.metrics.ParameterStatistics
    name: Parameter
  - _target_: src.metrics.OptimizerStatistics
    name: Optimizer
  - _target_: src.metrics.LatentsStatistics
    name: Latents
  - _target_: src.metrics.BlockLogitsStatistics
    name: BlockLogits
  - _target_: src.metrics.ActivationStatisitcs
    name: Activations

inference:
  - _target_: src.metrics.BlockTypeAccuracy
    name: "BlockTypeAccuracy"
  - _target_: src.metrics.MacroRecall
    name: "MacroRecall"
    filter_rare_classes: True
  - _target_: src.metrics.AP
    name: "AirAP"
  - _target_: src.metrics.AP
    name: "mAP_new"
    air_only: False
    filter_rare_classes: True
  - _target_: src.metrics.AttributeAccuracy
    name: "MatchedAttrAccuracy"
  - _target_: src.metrics.AttributeAccuracy
    name: "GlobalAttrAccuracy"
    block_equality: False
